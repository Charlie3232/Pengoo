<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Pengoo 登入監控</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:#F5F0EE;color:#3A2A2E;font-family:'Nunito','Noto Sans TC',sans-serif;display:flex;justify-content:center;}
.wrap{width:100%;max-width:430px;min-height:100vh;padding:1rem 1rem 2rem;}
.top{position:sticky;top:0;z-index:10;background:#F5F0EE;padding:0.7rem 0 0.9rem;}
.bar{display:flex;align-items:center;justify-content:space-between;gap:0.7rem;}
.eyebrow{font-size:0.62rem;font-weight:900;letter-spacing:0.14em;color:#7A9BB5;margin-bottom:0.22rem;}
h1{font-size:1.35rem;font-weight:900;line-height:1.2;}
.back{height:34px;border-radius:99px;border:1px solid rgba(184,205,217,0.42);background:white;color:#6B2D3E;font-size:0.72rem;font-weight:900;padding:0 0.78rem;text-decoration:none;display:flex;align-items:center;}
.login,.card,.empty,.summary,.notice{background:white;border:1px solid rgba(184,205,217,0.34);border-radius:18px;box-shadow:0 12px 28px rgba(58,42,46,0.045);}
.login{padding:1rem;margin-top:0.65rem;text-align:center;}
.login-title{font-size:1rem;font-weight:900;margin-bottom:0.35rem;}
.login-sub{font-size:0.74rem;line-height:1.65;color:rgba(58,42,46,0.55);font-weight:760;margin-bottom:0.8rem;}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;}
.primary{height:42px;border:0;border-radius:13px;background:#6B2D3E;color:white;font-size:0.8rem;font-weight:900;padding:0 1rem;}
.ghost{height:34px;border-radius:99px;border:1px solid rgba(184,205,217,0.42);background:white;color:#3A5068;font-size:0.7rem;font-weight:900;padding:0 0.72rem;}
.panel{display:none;}
.panel.show{display:block;}
.tools{display:flex;gap:0.5rem;margin-top:0.7rem;flex-wrap:wrap;}
.notice{padding:0.78rem 0.85rem;margin:0.7rem 0 0;background:#FFF8E7;border-color:rgba(180,83,9,0.18);}
.notice-title{font-size:0.76rem;font-weight:900;color:#B45309;margin-bottom:0.18rem;}
.notice-text{font-size:0.68rem;font-weight:760;line-height:1.58;color:rgba(58,42,46,0.6);}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:0.3rem;padding:0.78rem;margin:0.7rem 0;}
.stat{text-align:center;}
.num{font-size:1.1rem;font-weight:900;color:#6B2D3E;}
.lbl{font-size:0.62rem;font-weight:850;color:rgba(58,42,46,0.45);margin-top:0.1rem;}
.list{display:grid;gap:0.7rem;}
.filters{display:flex;gap:0.45rem;overflow-x:auto;padding:0.08rem 0 0.72rem;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.chip{height:32px;border:1px solid rgba(184,205,217,0.5);border-radius:99px;background:white;color:rgba(58,42,46,0.58);font-size:0.68rem;font-weight:900;padding:0 0.72rem;white-space:nowrap;}
.chip.active{background:#3A2A2E;color:white;border-color:#3A2A2E;}
.search{width:100%;height:42px;border:1px solid rgba(184,205,217,0.5);border-radius:14px;background:white;padding:0 0.85rem;font:inherit;font-size:0.76rem;font-weight:800;color:#3A2A2E;outline:none;margin-bottom:0.72rem;}
.search:focus{border-color:#7A9BB5;box-shadow:0 0 0 3px rgba(122,155,181,0.16);}
.card{padding:0.82rem;}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:0.6rem;margin-bottom:0.5rem;}
.type{font-size:0.82rem;font-weight:900;line-height:1.35;word-break:break-word;}
.time{font-size:0.62rem;font-weight:850;color:rgba(58,42,46,0.4);white-space:nowrap;}
.pill{display:inline-flex;min-height:24px;align-items:center;border-radius:99px;background:rgba(184,205,217,0.18);color:#3A5068;font-size:0.62rem;font-weight:900;padding:0.22rem 0.48rem;margin:0 0.32rem 0.32rem 0;line-height:1.25;}
.pill.err{border:0;background:#FEE2E2;color:#B91C1C;}
.pill.good{background:#E6F4ED;color:#1D6B3E;}
.pill.warn{background:#FEF3C7;color:#B45309;}
.pill.bad{background:#FEE2E2;color:#B91C1C;}
.block{border-radius:12px;background:#F8F4F5;padding:0.58rem 0.62rem;margin-top:0.5rem;}
.k{font-size:0.58rem;font-weight:900;color:#7A9BB5;margin-bottom:0.18rem;}
.v{font-size:0.68rem;font-weight:760;line-height:1.48;color:rgba(58,42,46,0.68);word-break:break-word;white-space:pre-wrap;}
.plain{border-radius:14px;background:#F8F4F5;padding:0.68rem 0.72rem;margin-top:0.52rem;}
.plain-title{font-size:0.78rem;font-weight:900;color:#3A2A2E;line-height:1.45;display:flex;align-items:center;justify-content:space-between;gap:0.5rem;}
.plain-text{font-size:0.7rem;font-weight:760;color:rgba(58,42,46,0.62);line-height:1.65;margin-top:0.2rem;}
.plain-action{font-size:0.68rem;font-weight:850;color:rgba(58,42,46,0.68);line-height:1.65;margin-top:0.35rem;padding-top:0.35rem;border-top:1px solid rgba(255,255,255,0.45);}
.plain.ok{background:#E6F4ED;}
.plain.warn{background:#FEF3C7;}
.plain.bad{background:#FEE2E2;}
.copy-code,.copy-summary{border:0;}
.detail-toggle{width:100%;height:34px;margin-top:0.52rem;border:1px solid rgba(184,205,217,0.42);border-radius:12px;background:white;color:#3A5068;font-size:0.68rem;font-weight:900;}
.detail{display:none;}
.detail.show{display:block;}
.empty{padding:1.2rem;text-align:center;color:rgba(58,42,46,0.5);font-size:0.8rem;font-weight:800;line-height:1.65;}
.toast{position:fixed;top:4.8rem;left:50%;transform:translateX(-50%);z-index:50;background:#3A2A2E;color:white;border-radius:99px;padding:0.62rem 1rem;font-size:0.74rem;font-weight:850;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;}
.toast.show{opacity:1;}
@media(max-width:360px){
  .summary{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<main class="wrap">
  <header class="top">
    <div class="bar">
      <div>
        <div class="eyebrow">PENGOO ADMIN TOOL</div>
        <h1>登入監控</h1>
      </div>
      <a class="back" href="tools.html">工具頁</a>
    </div>
  </header>

  <section class="login" id="loginBox">
    <div class="login-title">管理員登入</div>
    <div class="login-sub">查看登入開始、登入失敗、redirect 回來失敗等紀錄。</div>
    <button class="primary" id="loginBtn" type="button">Google 管理員登入</button>
  </section>

  <section class="panel" id="panel">
    <div class="tools">
      <button class="ghost" id="reloadBtn" type="button">重新整理</button>
      <button class="ghost" id="autoBtn" type="button">即時更新：開</button>
      <button class="ghost" id="logoutBtn" type="button">登出</button>
    </div>
    <div class="notice">
      <div class="notice-title">看這頁的方式</div>
      <div class="notice-text">先看紅色或黃色事件。每筆會先翻成白話原因，技術細節只是給複製錯誤碼用。</div>
    </div>
    <div class="summary">
      <div class="stat"><div class="num" id="totalCount">0</div><div class="lbl">總事件</div></div>
      <div class="stat"><div class="num" id="errorCount">0</div><div class="lbl">錯誤</div></div>
      <div class="stat"><div class="num" id="storageBadCount">0</div><div class="lbl">暫存異常</div></div>
      <div class="stat"><div class="num" id="mobileCount">0</div><div class="lbl">手機</div></div>
    </div>
    <div class="filters" id="filters">
      <button class="chip active" type="button" data-filter="all">全部</button>
      <button class="chip" type="button" data-filter="error">錯誤</button>
      <button class="chip" type="button" data-filter="storage">暫存異常</button>
      <button class="chip" type="button" data-filter="popup">彈窗問題</button>
      <button class="chip" type="button" data-filter="redirect">跳轉問題</button>
      <button class="chip" type="button" data-filter="success">成功</button>
    </div>
    <input class="search" id="searchInput" type="search" placeholder="搜尋 Email、錯誤碼、網址或裝置"/>
    <div class="list" id="eventList"></div>
  </section>
</main>

<script type="module">
import { auth, provider, db } from './firebase-config.js';
import { signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { collection, doc, getDoc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const ADMIN_WHITELIST = ['kingnashmvp@yahoo.com.tw'];
const loginBox = document.getElementById('loginBox');
const panel = document.getElementById('panel');
const list = document.getElementById('eventList');
const toast = document.getElementById('toast');
const MONITOR_IGNORE_EMAILS = ['kingnashmvp@yahoo.com.tw'];
let allRows = [];
let activeFilter = 'all';
let unsubscribeEvents = null;
let autoRefresh = true;

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2400);
}

function escapeHtml(value=''){
  return String(value)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function formatTime(value){
  if(!value?.toDate) return '尚無時間';
  const d = value.toDate();
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

async function isAdmin(user){
  if(!user?.email) return false;
  try{
    const snap = await getDoc(doc(db, 'settings', 'admin'));
    const whitelist = snap.exists() && Array.isArray(snap.data().whitelist) ? snap.data().whitelist : ADMIN_WHITELIST;
    return whitelist.includes(user.email);
  } catch(e){
    return ADMIN_WHITELIST.includes(user.email);
  }
}

function isErrorType(type){
  return String(type || '').includes('error') || type === 'redirect_no_result';
}

function isMobileClient(client={}){
  const ua = String(client.userAgent || '').toLowerCase();
  return /iphone|ipad|android|mobile/.test(ua);
}

function getClientLabel(client={}){
  const ua = String(client.userAgent || '').toLowerCase();
  if(ua.includes('line')) return 'LINE 內建瀏覽器';
  if(ua.includes('instagram')) return 'IG 內建瀏覽器';
  if(ua.includes('fbav') || ua.includes('fban')) return 'FB 內建瀏覽器';
  if(ua.includes('crios')) return 'iPhone Chrome';
  if(ua.includes('fxios')) return 'iPhone Firefox';
  if(ua.includes('safari') && ua.includes('iphone')) return 'iPhone Safari';
  if(ua.includes('android') && ua.includes('chrome')) return 'Android Chrome';
  if(ua.includes('macintosh')) return 'Mac';
  if(ua.includes('windows')) return 'Windows';
  if(isMobileClient(client)) return '手機瀏覽器';
  return '未知裝置';
}

function getSeverity(row){
  if(isErrorType(row.type)) return 'bad';
  if(row.type === 'login_fallback_redirect' || row.client?.storageOk === false) return 'warn';
  return 'ok';
}

function getEventTitle(type){
  const map = {
    login_start_redirect: '使用者開始用跳轉登入',
    login_start_popup: '使用者開始用彈窗登入',
    popup_success: '彈窗登入成功',
    login_error: '登入失敗',
    login_fallback_redirect: '彈窗失敗，改用跳轉登入',
    fallback_redirect_error: '改用跳轉登入也失敗',
    redirect_no_result: '跳轉回來但沒有登入成功',
    redirect_result_error: '跳轉回來後登入失敗',
    route_user_error: '登入後讀取用戶資料失敗'
  };
  return map[type] || type || '未知事件';
}

function explainEvent(row){
  const type = row.type || '';
  const code = row.detail?.code || '';
  const message = row.detail?.message || '';
  const client = row.client || {};
  const ua = String(client.userAgent || '').toLowerCase();
  const href = client.href || '';

  if(!isErrorType(type)){
    if(type === 'popup_success') return { tone:'ok', title:'登入成功', text:'這筆只是成功紀錄，不需要處理。' };
    if(type === 'login_fallback_redirect') return { tone:'warn', title:'彈窗被擋，所以改用跳轉登入', text:'通常發生在手機瀏覽器或瀏覽器擋彈窗。只要後面有成功登入，這不是大問題。', action:'如果同一個人後面沒有成功紀錄，再請他用 Safari 或 Chrome 正常模式開啟。' };
    return { tone:'ok', title:'登入流程開始', text:'使用者有按登入。這筆不是錯誤，只是紀錄當時使用的登入方式。' };
  }

  if(type === 'redirect_no_result'){
    return { tone:'bad', title:'Google 回來了，但 Firebase 沒拿到登入結果', text:'這就會讓使用者看起來一直回到登入首頁。常見原因是 Safari 隱私模式、LINE/IG/FB 內建瀏覽器、阻擋網站暫存，或瀏覽器清掉登入狀態。', action:'請使用者用 Safari/Chrome 正常模式重新開主網址。如果你已改成只用 popup，後續新紀錄不應該再大量出現這種事件。' };
  }

  if(code.includes('popup-closed-by-user')){
    return { tone:'warn', title:'使用者關掉 Google 登入視窗', text:'通常是使用者自己按返回、關閉彈窗，或沒有選 Google 帳號。', action:'請他回首頁重新按一次 Google 登入。' };
  }
  if(code.includes('popup-blocked')){
    return { tone:'warn', title:'瀏覽器擋住登入彈窗', text:'常見於手機瀏覽器或內建瀏覽器阻擋彈出視窗。', action:'請使用者改用 Safari / Chrome 正常開啟，不要在 LINE、IG、FB 內建瀏覽器裡開。' };
  }
  if(code.includes('unauthorized-domain') || message.includes('unauthorized-domain')){
    return { tone:'bad', title:'這個網址還沒加入 Firebase 授權網域', text:'Google 登入只允許已授權的網域。', action:'到 Firebase Authentication 的授權網域，把 GitHub Pages、dev tunnel、正式網域都加進去。' };
  }
  if(code.includes('permission-denied') || message.includes('Missing or insufficient permissions')){
    return { tone:'bad', title:'Firebase 權限規則擋住了', text:'代表登入後讀寫 Firestore 或 Storage 時被規則擋下。', action:'先看錯誤發生頁面，再檢查 Firestore Rules 或 Storage Rules。' };
  }
  if(message.includes('missing initial state') || message.includes('sessionStorage') || client.storageOk === false){
    return { tone:'bad', title:'手機瀏覽器暫存被擋，Google 登入回來時找不到狀態', text:'常見於 Safari 隱私模式、LINE/IG/FB 內建瀏覽器，或使用者阻擋網站追蹤。', action:'請使用者用 Safari/Chrome 正常模式開主網址，關閉無痕模式後再試。' };
  }
  if(ua.includes('line') || ua.includes('instagram') || ua.includes('fbav') || ua.includes('fban')){
    return { tone:'warn', title:'可能是在 App 內建瀏覽器開啟', text:'內建瀏覽器常讓 Google 登入失敗。', action:'請使用者按右上角或分享，改用 Safari / Chrome 開啟。' };
  }
  if(href.startsWith('file:')){
    return { tone:'bad', title:'使用者用 file:// 開啟網頁', text:'Firebase 登入不能用直接開檔案的方式。', action:'要用 GitHub Pages、正式網址，或本機 Live Server。' };
  }
  return { tone:'warn', title:'登入失敗，但原因需要看錯誤碼', text:'先複製錯誤碼給我，我可以再判斷是哪一層問題。', action:'點「複製摘要」或展開技術細節，把錯誤碼和網址貼給我。' };
}

function rowMatchesFilter(row){
  const type = String(row.type || '');
  if(activeFilter === 'error') return isErrorType(type);
  if(activeFilter === 'storage') return row.client?.storageOk === false;
  if(activeFilter === 'popup') return type.includes('popup');
  if(activeFilter === 'redirect') return type.includes('redirect');
  if(activeFilter === 'success') return type.includes('success');
  return true;
}

function rowMatchesSearch(row){
  const term = document.getElementById('searchInput').value.trim().toLowerCase();
  if(!term) return true;
  const client = row.client || {};
  const detail = row.detail || {};
  return [
    row.type,
    row.email,
    detail.email,
    detail.code,
    detail.message,
    client.href,
    client.userAgent,
    getClientLabel(client)
  ].some(value => String(value || '').toLowerCase().includes(term));
}

function copySummary(row){
  const explain = explainEvent(row);
  const client = row.client || {};
  const detail = row.detail || {};
  return [
    `事件：${getEventTitle(row.type)}`,
    `時間：${formatTime(row.createdAt)}`,
    `判斷：${explain.title}`,
    `建議：${explain.action || explain.text}`,
    `Email：${row.email || detail.email || '沒有'}`,
    `錯誤碼：${detail.code || '沒有'}`,
    `網址：${client.href || '沒有'}`,
    `裝置：${getClientLabel(client)}`,
    `暫存：${client.storageOk === false ? '異常' : '正常'}`
  ].join('\n');
}

function renderRows(){
  const rows = allRows.filter(rowMatchesFilter).filter(rowMatchesSearch);
  document.getElementById('totalCount').textContent = allRows.length;
  document.getElementById('errorCount').textContent = allRows.filter(row => isErrorType(row.type)).length;
  document.getElementById('storageBadCount').textContent = allRows.filter(row => row.client?.storageOk === false).length;
  document.getElementById('mobileCount').textContent = allRows.filter(row => isMobileClient(row.client)).length;

  if(!rows.length){
    list.innerHTML = '<div class="empty">目前沒有符合條件的登入事件</div>';
    return;
  }

  list.innerHTML = rows.map(row => {
    const code = row.detail?.code || '';
    const message = row.detail?.message || '';
    const client = row.client || {};
    const explain = explainEvent(row);
    const severity = getSeverity(row);
    const email = row.email || row.detail?.email || '';
    return `
      <article class="card">
        <div class="card-top">
          <div class="type">${escapeHtml(getEventTitle(row.type))}</div>
          <div class="time">${escapeHtml(formatTime(row.createdAt))}</div>
        </div>
        <div class="plain ${escapeHtml(explain.tone)}">
          <div class="plain-title">
            <span>${escapeHtml(explain.title)}</span>
            <span class="pill ${escapeHtml(severity)}">${severity === 'bad' ? '要處理' : severity === 'warn' ? '留意' : '正常'}</span>
          </div>
          <div class="plain-text">${escapeHtml(explain.text)}</div>
          ${explain.action ? `<div class="plain-action">建議：${escapeHtml(explain.action)}</div>` : ''}
        </div>
        <div>
          ${code ? `<button class="pill err copy-code" type="button" data-copy="${escapeHtml(code)}">複製錯誤碼：${escapeHtml(code)}</button>` : ''}
          <button class="pill copy-summary" type="button" data-copy-summary="${escapeHtml(row.id)}">複製摘要</button>
          <span class="pill ${client.storageOk === false ? 'err' : 'good'}">暫存：${client.storageOk === false ? '異常' : '正常'}</span>
          <span class="pill">${escapeHtml(getClientLabel(client))}</span>
          ${email ? `<span class="pill">${escapeHtml(email)}</span>` : ''}
        </div>
        <button class="detail-toggle" type="button" data-detail="${escapeHtml(row.id)}">查看技術細節</button>
        <div class="detail" data-detail-box="${escapeHtml(row.id)}">
          <div class="block"><div class="k">原始事件</div><div class="v">${escapeHtml(row.type || '')}</div></div>
          ${code ? `<div class="block"><div class="k">錯誤碼</div><div class="v">${escapeHtml(code)}</div></div>` : ''}
          ${message ? `<div class="block"><div class="k">原始錯誤訊息</div><div class="v">${escapeHtml(message)}</div></div>` : ''}
          <div class="block"><div class="k">網址</div><div class="v">${escapeHtml(client.href || '')}</div></div>
          <div class="block"><div class="k">裝置</div><div class="v">${escapeHtml(client.userAgent || '')}</div></div>
          <div class="block"><div class="k">畫面</div><div class="v">${escapeHtml(client.viewport || '')} / ${escapeHtml(client.screen || '')}</div></div>
        </div>
      </article>
    `;
  }).join('');
}

function applySnapshot(snap){
  allRows = snap.docs
    .map(d => ({ id:d.id, ...d.data() }))
    .filter(row => !MONITOR_IGNORE_EMAILS.includes(String(row.email || row.detail?.email || '').toLowerCase()));
  renderRows();
}

function loadEvents(){
  list.innerHTML = '<div class="empty">載入中...</div>';
  if(unsubscribeEvents){
    unsubscribeEvents();
    unsubscribeEvents = null;
  }
  try{
    const q = query(collection(db, 'loginEvents'), orderBy('createdAt', 'desc'), limit(80));
    if(autoRefresh){
      unsubscribeEvents = onSnapshot(q, applySnapshot, e => {
        console.error(e);
        list.innerHTML = '<div class="empty">讀取失敗。請確認 Firestore Rules 允許管理員 read loginEvents。</div>';
      });
    } else {
      unsubscribeEvents = onSnapshot(q, snap => {
        applySnapshot(snap);
        if(unsubscribeEvents){
          unsubscribeEvents();
          unsubscribeEvents = null;
        }
      }, e => {
        console.error(e);
        list.innerHTML = '<div class="empty">讀取失敗。請確認 Firestore Rules 允許管理員 read loginEvents。</div>';
      });
    }
  } catch(e){
    console.error(e);
    list.innerHTML = '<div class="empty">讀取失敗。請確認 Firestore Rules 允許管理員 read loginEvents。</div>';
  }
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  try{
    await signInWithPopup(auth, provider);
  } catch(e){
    console.error(e);
    showToast('登入失敗');
  }
});
document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
document.getElementById('reloadBtn').addEventListener('click', loadEvents);
document.getElementById('autoBtn').addEventListener('click', event => {
  autoRefresh = !autoRefresh;
  event.currentTarget.textContent = `即時更新：${autoRefresh ? '開' : '關'}`;
  loadEvents();
});
document.getElementById('filters').addEventListener('click', event => {
  const btn = event.target.closest('[data-filter]');
  if(!btn) return;
  activeFilter = btn.dataset.filter;
  document.querySelectorAll('[data-filter]').forEach(item => item.classList.toggle('active', item === btn));
  renderRows();
});
document.getElementById('searchInput').addEventListener('input', renderRows);
list.addEventListener('click', async event => {
  const copyBtn = event.target.closest('[data-copy]');
  if(copyBtn){
    try{
      await navigator.clipboard.writeText(copyBtn.dataset.copy);
      showToast('錯誤碼已複製');
    } catch(e){
      showToast('複製失敗，請手動長按複製');
    }
    return;
  }
  const summaryBtn = event.target.closest('[data-copy-summary]');
  if(summaryBtn){
    const row = allRows.find(item => item.id === summaryBtn.dataset.copySummary);
    if(row){
      try{
        await navigator.clipboard.writeText(copySummary(row));
        showToast('摘要已複製');
      } catch(e){
        showToast('複製失敗，請手動長按複製');
      }
    }
    return;
  }
  const detailBtn = event.target.closest('[data-detail]');
  if(detailBtn){
    const box = detailBtn.closest('.card')?.querySelector(`[data-detail-box="${detailBtn.dataset.detail}"]`);
    if(box) box.classList.toggle('show');
  }
});

onAuthStateChanged(auth, async user => {
  if(!user){
    loginBox.style.display = 'block';
    panel.classList.remove('show');
    return;
  }
  const ok = await isAdmin(user);
  if(!ok){
    showToast('這個帳號不是管理員');
    await signOut(auth);
    return;
  }
  loginBox.style.display = 'none';
  panel.classList.add('show');
  loadEvents();
});
</script>
</body>
</html>
