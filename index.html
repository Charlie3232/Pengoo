<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Pengoo — 企鵝月老幫你牽紅線</title>
<meta name="description" content="Pengoo 交友配對，企鵝月老幫你找到命中注定的人"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;width:100%;}
body{
  font-family:'Nunito','Noto Sans TC',sans-serif;
  background:#E8B4BC;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;
  position:relative;
}

/* 光暈裝飾 */
.glow{position:fixed;border-radius:50%;pointer-events:none;z-index:0;}
.glow1{top:-80px;left:-80px;width:280px;height:280px;background:rgba(255,255,255,0.2);}
.glow2{bottom:-60px;right:-60px;width:220px;height:220px;background:rgba(180,140,150,0.2);}
.glow3{top:40%;left:50%;transform:translate(-50%,-50%);width:400px;height:400px;background:rgba(255,255,255,0.1);}

/* 浮動粒子 */
.bbg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.fb{position:absolute;border-radius:50%;animation:floatUp linear infinite;opacity:0;}
@keyframes floatUp{
  0%{transform:translateY(0) translateX(0) scale(1);opacity:0;}
  10%{opacity:0.5;}
  90%{opacity:0.1;}
  100%{transform:translateY(-100vh) translateX(var(--drift)) scale(0.6);opacity:0;}
}

/* 主容器 */
.wrap{
  position:relative;z-index:1;
  width:100%;max-width:390px;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:0 1.5rem;
}

/* 狀態列 */
.status-bar{
  width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:1rem 0 0;
  font-size:0.72rem;font-weight:700;
  color:rgba(107,45,62,0.5);
  letter-spacing:0.05em;
}

/* LOGO 區 */
.hero{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:2rem 0 1.5rem;width:100%;
}

/* 企鵝動畫容器 */
.pengoo-container{
  position:relative;
  width:130px;height:150px;
  margin-bottom:1.5rem;
}
.pengoo-svg{
  width:130px;height:150px;
  animation:wobble 3.5s ease-in-out infinite;
  filter:drop-shadow(0 0 20px rgba(204,17,17,0.3));
}
@keyframes wobble{
  0%,100%{transform:rotate(-3deg) translateY(0);}
  25%{transform:rotate(3deg) translateY(-8px);}
  75%{transform:rotate(1.5deg) translateY(-10px);}
}

/* 紅線動畫 */
.red-thread{
  position:absolute;
  top:50px;right:-20px;
  animation:threadPulse 3.5s ease-in-out infinite;
}
@keyframes threadPulse{
  0%,100%{opacity:0.6;transform:scale(1);}
  50%{opacity:1;transform:scale(1.1);}
}

/* APP 名稱 */
.brand-name{
  font-size:2.8rem;font-weight:900;
  color:#6B2D3E;letter-spacing:2px;
  margin-bottom:0.3rem;
  text-shadow:0 0 40px rgba(204,17,17,0.4);
}
.brand-tagline{
  font-size:0.8rem;font-weight:600;
  color:#7A9BB5;
  letter-spacing:0.15em;
  margin-bottom:2.5rem;
}

/* 主標題 */
.hero-title{
  font-size:1.6rem;font-weight:900;
  color:#5A2030;text-align:center;
  line-height:1.25;margin-bottom:0.6rem;
}
.hero-title .accent{color:#5A2030;text-shadow:0 0 12px rgba(255,107,138,0.6),0 0 24px rgba(255,107,138,0.3);}
.hero-sub{
  font-size:0.82rem;color:#6B6B6B;
  text-align:center;line-height:1.7;
  margin-bottom:2.5rem;
  max-width:260px;
}

/* 統計數字 */


/* 登入區塊 */
.login-area{width:100%;margin-bottom:1.5rem;}

/* 錯誤訊息 */
.error-msg{
  display:none;
  background:rgba(107,45,62,0.1);
  border:1px solid rgba(107,45,62,0.3);
  border-radius:12px;padding:0.75rem 1rem;
  margin-bottom:0.8rem;
  font-size:0.8rem;color:#6B2D3E;font-weight:700;text-align:center;
}
.error-msg.show{display:block;}

/* Google 登入按鈕 */
.btn-google{
  width:100%;padding:1.1rem;
  border-radius:16px;border:none;
  background:#ffffff;
  display:flex;align-items:center;justify-content:center;gap:0.8rem;
  font-size:0.95rem;font-weight:800;color:#1a1a1a;
  cursor:pointer;touch-action:manipulation;
  transition:all 0.15s;
  margin-bottom:0.8rem;
  box-shadow:0 4px 20px rgba(255,255,255,0.1);
}
.btn-google:active{transform:scale(0.97);}
.google-icon{width:20px;height:20px;flex-shrink:0;}

/* 分隔 */
.divider{
  display:flex;align-items:center;gap:0.8rem;
  margin:0.3rem 0 0.8rem;
  color:rgba(107,45,62,0.4);font-size:0.75rem;font-weight:700;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(107,45,62,0.15);}

/* 來賓瀏覽按鈕 */
.btn-ghost{
  width:100%;padding:1rem;
  border-radius:16px;
  border:none;
  background:#6B2D3E;
  font-size:0.9rem;font-weight:700;
  color:#ffffff;
  cursor:pointer;touch-action:manipulation;
  transition:all 0.15s;
}
.btn-ghost:active{background:#5A2030;}

/* 頁面指示點 */
.page-dots{
  display:flex;gap:6px;margin:1.5rem 0 1rem;
  align-items:center;justify-content:center;
}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(107,45,62,0.2);transition:all 0.3s;}
.dot.active{background:#6B2D3E;width:20px;border-radius:3px;}

/* 底部說明 */
.footer-note{
  font-size:0.68rem;color:rgba(107,45,62,0.45);
  text-align:center;line-height:1.8;
  padding-bottom:2rem;
}
.footer-note a{color:#6B2D3E;text-decoration:none;}

/* Loading 遮罩 */
.loading-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(232,180,188,0.97);
  z-index:100;align-items:center;justify-content:center;
  flex-direction:column;gap:1.2rem;
}
.loading-overlay.show{display:flex;}
.pengoo-loading{
  width:70px;height:70px;
  animation:loadingBounce 1s ease-in-out infinite;
}
@keyframes loadingBounce{
  0%,100%{transform:translateY(0) rotate(-3deg);}
  50%{transform:translateY(-12px) rotate(3deg);}
}
.loading-text{
  font-size:0.85rem;font-weight:700;
  color:rgba(107,45,62,0.6);
  letter-spacing:0.05em;
}
.loading-dots{display:flex;gap:6px;}
.loading-dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(107,45,62,0.4);
  animation:dotPulse 1.4s ease-in-out infinite;
}
.loading-dot:nth-child(2){animation-delay:0.2s;}
.loading-dot:nth-child(3){animation-delay:0.4s;}
@keyframes dotPulse{
  0%,80%,100%{transform:scale(0.6);opacity:0.3;}
  40%{transform:scale(1);opacity:1;}
}
</style>
</head>
<body>

      <div class="error-msg" id="errorMsg"></div>

      <button class="btn-google" id="btnGoogle">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBE3TBpedUJoDu5r9pJqC4yTzSscbGRqZ0",
  authDomain: "pengoo-3c14a.firebaseapp.com",
  databaseURL: "https://pengoo-3c14a-default-rtdb.firebaseio.com",
  projectId: "pengoo-3c14a",
  storageBucket: "pengoo-3c14a.firebasestorage.app",
  messagingSenderId: "76943284602",
  appId: "1:76943284602:web:612cd5a7e802e42da25ec3",
  measurementId: "G-Q2YZCTVNTN"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const loadingOverlay = document.getElementById('loadingOverlay');
const errorMsg = document.getElementById('errorMsg');
let handlingAuth = false;
let redirectChecked = false;

function showLoading(){ loadingOverlay.classList.add('show'); }
function hideLoading(){ loadingOverlay.classList.remove('show'); }
function showError(msg){
  errorMsg.textContent = msg;
  errorMsg.classList.add('show');
  setTimeout(()=>errorMsg.classList.remove('show'), 4000);
}

function shouldUseRedirectLogin(){
  const ua = navigator.userAgent || '';
  const isMobile = /iPhone|iPad|iPod|Android/i.test(ua);
  const isSafari = /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|Chrome/i.test(ua);
  return isMobile || isSafari;
}

async function routeUser(user){
  if(!user || handlingAuth) return;
  handlingAuth = true;
  showLoading();

  try{
    const userRef = doc(db,'users',user.uid);
    const userSnap = await getDoc(userRef);

    if(!userSnap.exists()){
      await setDoc(userRef,{
        uid: user.uid,
        displayName: user.displayName||'',
        email: user.email||'',
        photoURL: user.photoURL||'',
        gender: null,
        age: null,
        selfieURL: null,
        selfieApproved: false,
        quizComplete: false,
        profileComplete: false,
        pendingReview: false,
        createdAt: serverTimestamp(),
        lastActive: serverTimestamp(),
        matchScore: {},
        blocked: [],
      });
      window.location.href = 'profile.html';
      return;
    }

    const d = userSnap.data();
    if(d.deleted || d.adminDeleted){
      window.location.href = 'profile.html';
    } else if(d.pendingReview || d.selfieApproved || d.quizComplete || d.rejected){
      window.location.href = 'home.html';
    } else {
      window.location.href = 'profile.html';
    }
  } catch(e){
    console.error(e);
    handlingAuth = false;
    hideLoading();
    showError('登入資料讀取失敗，請重新整理後再試一次');
  }
}

async function handleRedirectLoginResult(){
  try{
    const result = await getRedirectResult(auth);
    redirectChecked = true;
    if(result?.user) await routeUser(result.user);
  } catch(err){
    redirectChecked = true;
    hideLoading();
    console.error(err);
    showError('Google 登入沒有完成，請回到主網址後再試一次');
  }
}

handleRedirectLoginResult();

// 已登入直接跳轉
onAuthStateChanged(auth, async (user) => {
  if(!user || handlingAuth) return;
  if(!redirectChecked){
    setTimeout(() => {
      if(auth.currentUser && !handlingAuth) routeUser(auth.currentUser);
    }, 350);
    return;
  }
  routeUser(user);
});

// Google 登入
document.getElementById('btnGoogle').onclick = async () => {
  showLoading();
  try{
    if(shouldUseRedirectLogin()){
      await signInWithRedirect(auth, provider);
      return;
    }
    const result = await signInWithPopup(auth, provider);
    await routeUser(result.user);
  } catch(err){
    hideLoading();
    if(err.code==='auth/popup-closed-by-user') return;
    if(err.code==='auth/popup-blocked'){
      try{
        await signInWithRedirect(auth, provider);
      } catch(redirectErr){
        console.error(redirectErr);
        showError('請用 Safari 或 Chrome 開啟後再登入');
      }
    }
    else showError('登入失敗，請再試一次');
    console.error(err);
  }
};



// 浮動粒子
(function(){
  const bg = document.getElementById('bbg');
  const colors = [
    'rgba(176,210,230,0.45)',
    'rgba(184,205,217,0.35)',
    'rgba(200,225,240,0.3)',
    'rgba(150,195,220,0.25)',
  ];
  for(let i=0;i<25;i++){
    const b = document.createElement('div');
    b.className='fb';
    const sz=6+Math.random()*22;
    const dur=12+Math.random()*18;
    const delay=Math.random()*15;
    const drift=(Math.random()-0.5)*100;
    b.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:-${sz}px;background:${colors[Math.floor(Math.random()*colors.length)]};--drift:${drift}px;animation-duration:${dur}s;animation-delay:${delay}s;`;
    bg.appendChild(b);
  }
})();
</script>
</body>
