<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Pengoo 申請未完成監控</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:#F5F0EE;color:#3A2A2E;font-family:'Nunito','Noto Sans TC',sans-serif;display:flex;justify-content:center;}
.wrap{width:100%;max-width:430px;min-height:100vh;padding:1rem 1rem 2rem;}
.top{position:sticky;top:0;z-index:10;background:#F5F0EE;padding:0.7rem 0 0.9rem;}
.bar{display:flex;align-items:center;justify-content:space-between;gap:0.7rem;}
.eyebrow{font-size:0.62rem;font-weight:900;letter-spacing:0.14em;color:#7A9BB5;margin-bottom:0.22rem;}
h1{font-size:1.35rem;font-weight:900;line-height:1.2;}
.back{height:34px;border-radius:99px;border:1px solid rgba(184,205,217,0.42);background:white;color:#6B2D3E;font-size:0.72rem;font-weight:900;padding:0 0.78rem;text-decoration:none;display:flex;align-items:center;}
.login,.card,.empty,.summary{background:white;border:1px solid rgba(184,205,217,0.34);border-radius:18px;box-shadow:0 12px 28px rgba(58,42,46,0.045);}
.login{padding:1rem;margin-top:0.65rem;text-align:center;}
.login-title{font-size:1rem;font-weight:900;margin-bottom:0.35rem;}
.login-sub{font-size:0.74rem;line-height:1.65;color:rgba(58,42,46,0.55);font-weight:760;margin-bottom:0.8rem;}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;}
.primary{height:42px;border:0;border-radius:13px;background:#6B2D3E;color:white;font-size:0.8rem;font-weight:900;padding:0 1rem;}
.ghost{height:34px;border-radius:99px;border:1px solid rgba(184,205,217,0.42);background:white;color:#3A5068;font-size:0.7rem;font-weight:900;padding:0 0.72rem;}
.panel{display:none;}
.panel.show{display:block;}
.tools{display:flex;gap:0.5rem;margin-top:0.7rem;}
.search{width:100%;height:42px;border-radius:14px;border:1.5px solid rgba(184,205,217,0.48);background:white;color:#3A2A2E;font-size:0.82rem;font-weight:800;padding:0 0.82rem;outline:none;margin-top:0.7rem;}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:0.3rem;padding:0.78rem;margin:0.7rem 0;}
.stat{text-align:center;}
.num{font-size:1.1rem;font-weight:900;color:#6B2D3E;}
.lbl{font-size:0.62rem;font-weight:850;color:rgba(58,42,46,0.45);margin-top:0.1rem;}
.list{display:grid;gap:0.72rem;}
.card{padding:0.82rem;}
.head{display:grid;grid-template-columns:50px 1fr auto;align-items:center;gap:0.58rem;}
.photo{width:50px;height:50px;border-radius:14px;object-fit:cover;background:#F8F4F5;border:1px solid rgba(184,205,217,0.34);}
.photo.empty{display:flex;align-items:center;justify-content:center;font-size:0.56rem;font-weight:900;color:rgba(58,42,46,0.34);}
.name{font-size:0.88rem;font-weight:900;line-height:1.4;}
.meta{font-size:0.6rem;font-weight:760;color:rgba(58,42,46,0.42);line-height:1.45;word-break:break-all;margin-top:0.08rem;}
.badge{height:28px;border-radius:99px;font-size:0.66rem;font-weight:900;display:flex;align-items:center;padding:0 0.54rem;white-space:nowrap;}
.badge.bad{background:#FEE2E2;color:#B91C1C;}
.badge.warn{background:#FEF3C7;color:#B45309;}
.badge.ok{background:#E6F4ED;color:#1D6B3E;}
.info{margin-top:0.6rem;border-radius:13px;background:#F8F4F5;padding:0.62rem 0.68rem;}
.row{display:grid;grid-template-columns:5.2rem 1fr;gap:0.5rem;font-size:0.68rem;line-height:1.55;margin-bottom:0.26rem;}
.row:last-child{margin-bottom:0;}
.k{font-weight:900;color:#7A9BB5;}
.v{font-weight:780;color:rgba(58,42,46,0.68);word-break:break-word;}
.empty{padding:1.2rem;text-align:center;color:rgba(58,42,46,0.5);font-size:0.8rem;font-weight:800;line-height:1.65;}
.toast{position:fixed;top:4.8rem;left:50%;transform:translateX(-50%);z-index:50;background:#3A2A2E;color:white;border-radius:99px;padding:0.62rem 1rem;font-size:0.74rem;font-weight:850;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<main class="wrap">
  <header class="top">
    <div class="bar">
      <div>
        <div class="eyebrow">PENGOO ADMIN TOOL</div>
        <h1>申請未完成監控</h1>
      </div>
      <a class="back" href="tools.html">工具頁</a>
    </div>
  </header>

  <section class="login" id="loginBox">
    <div class="login-title">管理員登入</div>
    <div class="login-sub">查看哪些用戶登入後沒有送出審核，以及可能卡在哪一步。</div>
    <button class="primary" id="loginBtn" type="button">Google 管理員登入</button>
  </section>

  <section class="panel" id="panel">
    <div class="tools">
      <button class="ghost" id="reloadBtn" type="button">重新整理</button>
      <button class="ghost" id="logoutBtn" type="button">登出</button>
    </div>
    <input class="search" id="searchInput" placeholder="搜尋暱稱、UID、Email、卡住原因"/>
    <div class="summary">
      <div class="stat"><div class="num" id="incompleteCount">0</div><div class="lbl">未完成</div></div>
      <div class="stat"><div class="num" id="photoCount">0</div><div class="lbl">照片卡住</div></div>
      <div class="stat"><div class="num" id="selfieCount">0</div><div class="lbl">自拍卡住</div></div>
    </div>
    <div class="list" id="list"></div>
  </section>
</main>

<script type="module">
import { auth, provider, db } from './firebase-config.js';
import { signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { collection, doc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const ADMIN_WHITELIST = ['kingnashmvp@yahoo.com.tw'];
const loginBox = document.getElementById('loginBox');
const panel = document.getElementById('panel');
const list = document.getElementById('list');
const toast = document.getElementById('toast');
const searchInput = document.getElementById('searchInput');
let users = [];

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

function escapeHtml(value=''){
  return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

function formatTime(value){
  if(!value?.toDate) return '未知';
  const d = value.toDate();
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

async function isAdmin(user){
  try{
    const snap = await getDoc(doc(db, 'settings', 'admin'));
    const whitelist = snap.exists() && Array.isArray(snap.data().whitelist) ? snap.data().whitelist : ADMIN_WHITELIST;
    return whitelist.includes(user.email);
  } catch(e){
    return ADMIN_WHITELIST.includes(user.email);
  }
}

function isFinished(user){
  return user.pendingReview || user.selfieApproved || user.rejected || user.quizComplete;
}

function inferStep(user){
  const p = user.profileProgress || {};
  if(p.step) return { step:p.step, label:p.label || `步驟 ${p.step}`, status:p.status || 'in_progress', updatedAt:p.updatedAt };
  if(user.purpose) return { step:11, label:'上傳照片', status:'推測卡在照片或自拍', updatedAt:user.updatedAt };
  if(Array.isArray(user.tags) && user.tags.length) return { step:10, label:'感情目的', status:'推測卡在目的或照片', updatedAt:user.updatedAt };
  if(user.bio) return { step:9, label:'個性標籤', status:'推測卡在標籤', updatedAt:user.updatedAt };
  if(user.nickname || user.age || user.gender) return { step:2, label:'基本資料', status:'推測卡在基本資料', updatedAt:user.updatedAt || user.createdAt };
  return { step:0, label:'剛建立帳號', status:'只登入，尚未開始填寫', updatedAt:user.createdAt };
}

function missingFields(user){
  const missing = [];
  if(!user.nickname) missing.push('暱稱');
  if(!user.age) missing.push('年齡');
  if(!user.gender) missing.push('性別');
  if(!user.lookingFor) missing.push('想找對象');
  if(!user.city) missing.push('縣市');
  if(!user.height) missing.push('身高');
  if(!user.job) missing.push('職業');
  if(!user.bio) missing.push('自介');
  if(!Array.isArray(user.tags) || user.tags.length < 3) missing.push('標籤');
  if(!user.purpose) missing.push('目的');
  if(!Array.isArray(user.photos) || user.photos.length < 3) missing.push('照片');
  if(!user.selfieURL) missing.push('自拍');
  return missing;
}

function reasonFor(user){
  const progress = inferStep(user);
  if(progress.status === 'photo_upload_failed') return '照片上傳失敗';
  if(progress.status === 'submit_review_failed') return '送出審核失敗';
  if(progress.status === 'selfie_ready') return '自拍已拍，尚未送出審核';
  if(progress.status === 'photos_ready') return '照片已滿 3 張，尚未完成自拍';
  if(progress.step === 0) return '只完成 Google 登入';
  if(progress.step === 11) return '卡在照片上傳';
  if(progress.step === 12) return '卡在自拍驗證或送出審核';
  return `卡在 ${progress.label}`;
}

async function loadData(){
  list.innerHTML = '<div class="empty">讀取中...</div>';
  try{
    const snap = await getDocs(collection(db, 'users'));
    users = snap.docs.map(d => ({ uid:d.id, ...d.data() }))
      .filter(user => !user.deleted && !user.adminDeleted && !isFinished(user));
    render();
  } catch(e){
    console.error(e);
    list.innerHTML = '<div class="empty">讀取失敗。請確認 Firestore Rules 允許管理員讀取 users。</div>';
  }
}

function render(){
  const keyword = searchInput.value.trim().toLowerCase();
  const enriched = users.map(user => ({
    user,
    progress: inferStep(user),
    missing: missingFields(user),
    reason: reasonFor(user)
  })).sort((a,b) => {
    const at = a.progress.updatedAt?.toMillis ? a.progress.updatedAt.toMillis() : 0;
    const bt = b.progress.updatedAt?.toMillis ? b.progress.updatedAt.toMillis() : 0;
    return bt - at;
  });
  const filtered = enriched.filter(item => {
    const u = item.user;
    const text = [u.uid, u.nickname, u.email, u.city, item.reason, item.missing.join(' ')].join(' ').toLowerCase();
    return !keyword || text.includes(keyword);
  });

  document.getElementById('incompleteCount').textContent = enriched.length;
  document.getElementById('photoCount').textContent = enriched.filter(item => item.reason.includes('照片')).length;
  document.getElementById('selfieCount').textContent = enriched.filter(item => item.reason.includes('自拍') || item.reason.includes('送出')).length;

  if(!filtered.length){
    list.innerHTML = '<div class="empty">沒有符合的未完成用戶</div>';
    return;
  }

  list.innerHTML = filtered.map(item => {
    const u = item.user;
    const photo = Array.isArray(u.photos) && u.photos.length ? u.photos[0] : (u.photoURL || '');
    const badgeClass = item.progress.step >= 11 ? 'warn' : item.progress.step === 0 ? 'bad' : 'ok';
    return `
      <article class="card">
        <div class="head">
          ${photo ? `<img class="photo" src="${escapeHtml(photo)}" alt="${escapeHtml(u.nickname || 'user')}">` : '<div class="photo empty">無圖</div>'}
          <div>
            <div class="name">${escapeHtml(u.nickname || u.displayName || '未填暱稱')}</div>
            <div class="meta">${escapeHtml(u.email || '')}</div>
            <div class="meta">${escapeHtml(u.uid)}</div>
          </div>
          <div class="badge ${badgeClass}">Step ${item.progress.step}</div>
        </div>
        <div class="info">
          <div class="row"><div class="k">目前判斷</div><div class="v">${escapeHtml(item.reason)}</div></div>
          <div class="row"><div class="k">最後狀態</div><div class="v">${escapeHtml(item.progress.status || '')}</div></div>
          <div class="row"><div class="k">最後時間</div><div class="v">${escapeHtml(formatTime(item.progress.updatedAt))}</div></div>
          <div class="row"><div class="k">缺少資料</div><div class="v">${escapeHtml(item.missing.join('、') || '無')}</div></div>
        </div>
      </article>
    `;
  }).join('');
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  try{
    await signInWithPopup(auth, provider);
  } catch(e){
    console.error(e);
    showToast('登入失敗');
  }
});
document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
document.getElementById('reloadBtn').addEventListener('click', loadData);
searchInput.addEventListener('input', render);

onAuthStateChanged(auth, async user => {
  if(!user){
    loginBox.style.display = 'block';
    panel.classList.remove('show');
    return;
  }
  const ok = await isAdmin(user);
  if(!ok){
    showToast('這個帳號不是管理員');
    await signOut(auth);
    return;
  }
  loginBox.style.display = 'none';
  panel.classList.add('show');
  loadData();
});
</script>
</body>
</html>
