<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Pengoo 配對漏斗監控</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:#F5F0EE;color:#3A2A2E;font-family:'Nunito','Noto Sans TC',sans-serif;display:flex;justify-content:center;}
.wrap{width:100%;max-width:430px;min-height:100vh;padding:1rem 1rem 2rem;}
.top{position:sticky;top:0;z-index:10;background:#F5F0EE;padding:0.7rem 0 0.9rem;}
.bar{display:flex;align-items:center;justify-content:space-between;gap:0.7rem;}
.eyebrow{font-size:0.62rem;font-weight:900;letter-spacing:0.14em;color:#7A9BB5;margin-bottom:0.22rem;}
h1{font-size:1.35rem;font-weight:900;line-height:1.2;}
.back{height:34px;border-radius:99px;border:1px solid rgba(184,205,217,0.42);background:white;color:#6B2D3E;font-size:0.72rem;font-weight:900;padding:0 0.78rem;text-decoration:none;display:flex;align-items:center;}
.login,.card,.empty,.summary{background:white;border:1px solid rgba(184,205,217,0.34);border-radius:18px;box-shadow:0 12px 28px rgba(58,42,46,0.045);}
.login{padding:1rem;margin-top:0.65rem;text-align:center;}
.login-title{font-size:1rem;font-weight:900;margin-bottom:0.35rem;}
.login-sub{font-size:0.74rem;line-height:1.65;color:rgba(58,42,46,0.55);font-weight:760;margin-bottom:0.8rem;}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;}
.primary{height:42px;border:0;border-radius:13px;background:#6B2D3E;color:white;font-size:0.8rem;font-weight:900;padding:0 1rem;}
.ghost{height:34px;border-radius:99px;border:1px solid rgba(184,205,217,0.42);background:white;color:#3A5068;font-size:0.7rem;font-weight:900;padding:0 0.72rem;}
.panel{display:none;}
.panel.show{display:block;}
.tools{display:flex;gap:0.5rem;margin-top:0.7rem;}
.search{width:100%;height:42px;border-radius:14px;border:1.5px solid rgba(184,205,217,0.48);background:white;color:#3A2A2E;font-size:0.82rem;font-weight:800;padding:0 0.82rem;outline:none;margin-top:0.7rem;}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:0.3rem;padding:0.78rem;margin:0.7rem 0;}
.stat{text-align:center;}
.num{font-size:1.1rem;font-weight:900;color:#6B2D3E;}
.lbl{font-size:0.62rem;font-weight:850;color:rgba(58,42,46,0.45);margin-top:0.1rem;}
.list{display:grid;gap:0.72rem;}
.card{padding:0.82rem;}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:0.6rem;margin-bottom:0.58rem;}
.name{font-size:0.9rem;font-weight:900;line-height:1.45;}
.uid{font-size:0.58rem;font-weight:760;color:rgba(58,42,46,0.36);word-break:break-all;}
.badge{height:28px;border-radius:99px;font-size:0.7rem;font-weight:900;display:flex;align-items:center;padding:0 0.56rem;flex-shrink:0;}
.badge.ok{background:#E6F4ED;color:#1D6B3E;}
.badge.warn{background:#FEF3C7;color:#B45309;}
.badge.bad{background:#FEE2E2;color:#B91C1C;}
.funnel{display:grid;gap:0.34rem;margin-top:0.55rem;}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0.5rem;border-radius:11px;background:#F8F4F5;padding:0.46rem 0.55rem;}
.row.clickable{cursor:pointer;touch-action:manipulation;}
.row.clickable:active{transform:scale(0.99);}
.row-k{font-size:0.68rem;font-weight:850;color:rgba(58,42,46,0.58);}
.row-v{font-size:0.72rem;font-weight:900;color:#3A2A2E;}
.drill{display:none;margin-top:-0.12rem;border-radius:12px;background:white;border:1px solid rgba(184,205,217,0.28);overflow:hidden;}
.drill.show{display:block;}
.drill-item{display:grid;grid-template-columns:46px 1fr;gap:0.58rem;align-items:center;padding:0.52rem 0.58rem;border-bottom:1px solid rgba(184,205,217,0.18);}
.drill-item:last-child{border-bottom:none;}
.drill-photo{width:46px;height:46px;border-radius:12px;object-fit:cover;background:#F8F4F5;border:1px solid rgba(184,205,217,0.34);}
.drill-photo.empty{display:flex;align-items:center;justify-content:center;font-size:0.54rem;font-weight:900;color:rgba(58,42,46,0.34);}
.drill-name{font-size:0.7rem;font-weight:900;color:#3A2A2E;line-height:1.45;}
.drill-meta{font-size:0.58rem;font-weight:760;color:rgba(58,42,46,0.4);word-break:break-all;line-height:1.45;}
.drill-reason{font-size:0.64rem;font-weight:760;color:rgba(58,42,46,0.62);line-height:1.45;margin-top:0.18rem;}
.reason{margin-top:0.58rem;border-radius:12px;background:rgba(184,205,217,0.12);padding:0.58rem 0.62rem;font-size:0.68rem;font-weight:760;line-height:1.55;color:rgba(58,42,46,0.62);}
.quiz-toggle{width:100%;height:36px;margin-top:0.58rem;border:0;border-radius:12px;background:#3A2A2E;color:white;font-size:0.72rem;font-weight:900;}
.quiz-panel{display:none;margin-top:0.46rem;border:1px solid rgba(184,205,217,0.3);border-radius:14px;background:white;overflow:hidden;}
.quiz-panel.show{display:block;}
.qa-item{padding:0.62rem 0.68rem;border-bottom:1px solid rgba(184,205,217,0.18);}
.qa-item:last-child{border-bottom:none;}
.qa-title{font-size:0.68rem;font-weight:900;line-height:1.5;color:#3A2A2E;}
.qa-answer{margin-top:0.28rem;font-size:0.66rem;font-weight:800;line-height:1.55;color:rgba(58,42,46,0.62);}
.qa-empty{padding:0.8rem;font-size:0.72rem;font-weight:850;color:rgba(58,42,46,0.48);text-align:center;}
.empty{padding:1.2rem;text-align:center;color:rgba(58,42,46,0.5);font-size:0.8rem;font-weight:800;line-height:1.65;}
.toast{position:fixed;top:4.8rem;left:50%;transform:translateX(-50%);z-index:50;background:#3A2A2E;color:white;border-radius:99px;padding:0.62rem 1rem;font-size:0.74rem;font-weight:850;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<main class="wrap">
  <header class="top">
    <div class="bar">
      <div>
        <div class="eyebrow">PENGOO ADMIN TOOL</div>
        <h1>配對漏斗監控</h1>
      </div>
      <a class="back" href="tools.html">工具頁</a>
    </div>
  </header>

  <section class="login" id="loginBox">
    <div class="login-title">管理員登入</div>
    <div class="login-sub">查看每個用戶目前為什麼有配對、或為什麼沒人可推薦。</div>
    <button class="primary" id="loginBtn" type="button">Google 管理員登入</button>
  </section>

  <section class="panel" id="panel">
    <div class="tools">
      <button class="ghost" id="reloadBtn" type="button">重新整理</button>
      <button class="ghost" id="logoutBtn" type="button">登出</button>
    </div>
    <input class="search" id="searchInput" placeholder="搜尋暱稱、UID、城市"/>
    <div class="summary">
      <div class="stat"><div class="num" id="userCount">0</div><div class="lbl">可分析</div></div>
      <div class="stat"><div class="num" id="hasRecoCount">0</div><div class="lbl">有推薦</div></div>
      <div class="stat"><div class="num" id="avgRecoCount">0</div><div class="lbl">平均推薦</div></div>
    </div>
    <div class="list" id="list"></div>
  </section>
</main>

<script type="module">
import { auth, provider, db } from './firebase-config.js';
import { signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { collection, doc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
import { calculateMutualMatch, MATCH_SCORE_CONFIG } from './quiz-scoring.js';
import { getQuizQuestions } from './quiz-bank.js';

const ADMIN_WHITELIST = ['kingnashmvp@yahoo.com.tw'];
const loginBox = document.getElementById('loginBox');
const panel = document.getElementById('panel');
const list = document.getElementById('list');
const toast = document.getElementById('toast');
const searchInput = document.getElementById('searchInput');
let users = [];
let actions = [];
let reports = [];

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2400);
}

function escapeHtml(value=''){
  return String(value)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

async function isAdmin(user){
  if(!user?.email) return false;
  try{
    const snap = await getDoc(doc(db, 'settings', 'admin'));
    const whitelist = snap.exists() && Array.isArray(snap.data().whitelist) ? snap.data().whitelist : ADMIN_WHITELIST;
    return whitelist.includes(user.email);
  } catch(e){
    return ADMIN_WHITELIST.includes(user.email);
  }
}

function isGenderCompatible(viewer, target){
  const viewerLooking = viewer.lookingFor || 'any';
  const targetLooking = target.lookingFor || 'any';
  const targetGender = target.gender || 'other';
  const viewerGender = viewer.gender || 'other';
  return {
    ok: (viewerLooking === 'any' || viewerLooking === targetGender) &&
      (targetLooking === 'any' || targetLooking === viewerGender),
    label: `你想找 ${viewerLooking} / 對方是 ${targetGender}；對方想找 ${targetLooking} / 你是 ${viewerGender}`
  };
}

function actionSetFor(uid){
  return new Set(actions.filter(a => a.actorUid === uid && a.targetUid).map(a => a.targetUid));
}

function baseCanAnalyze(user){
  return user.selfieApproved && user.quizComplete && !user.pendingReview && !user.rejected && user.quizAnswers && !user.deleted && !user.adminDeleted;
}

function analyzeUser(viewer){
  const acted = actionSetFor(viewer.uid);
  const counts = {
    total: users.length,
    self: 0,
    alreadyActed: 0,
    notReady: 0,
    blocked: 0,
    gender: 0,
    hardExclude: 0,
    lowScore: 0,
    recommended: 0
  };
  const groups = {
    total: [],
    self: [],
    alreadyActed: [],
    notReady: [],
    blocked: [],
    gender: [],
    hardExclude: [],
    lowScore: [],
    recommended: []
  };
  const lowExamples = [];
  const hardExamples = [];

  function pushGroup(key, target, reason='', match=null){
    groups[key].push({
      uid: target.uid,
      nickname: target.nickname || '未命名',
      city: target.city || '',
      gender: target.gender || '',
      lookingFor: target.lookingFor || '',
      photoURL: Array.isArray(target.photos) && target.photos.length ? target.photos[0] : '',
      reason,
      scoreA: match ? Math.round(match.scoreForA.rawScore) : null,
      scoreB: match ? Math.round(match.scoreForB.rawScore) : null
    });
  }

  users.forEach(target => {
    pushGroup('total', target, '全部用戶');
    if(target.uid === viewer.uid){ counts.self++; pushGroup('self', target, '這是目前分析的本人'); return; }
    if(acted.has(target.uid)){ counts.alreadyActed++; pushGroup('alreadyActed', target, '已經喜歡或略過'); return; }
    if(!target.selfieApproved || !target.quizComplete || target.pendingReview || target.rejected || target.adminBlocked || target.blocked === true || !target.quizAnswers || target.deleted || target.adminDeleted){
      counts.notReady++;
      const reasons = [];
      if(!target.selfieApproved) reasons.push('未審核通過');
      if(!target.quizComplete) reasons.push('未完成測驗');
      if(target.pendingReview) reasons.push('審核中');
      if(target.rejected) reasons.push('審核未通過');
      if(target.adminBlocked || target.blocked === true) reasons.push('被封鎖');
      if(!target.quizAnswers) reasons.push('沒有測驗答案');
      if(target.deleted || target.adminDeleted) reasons.push('已刪除');
      pushGroup('notReady', target, reasons.join('、') || '資料狀態不可推薦');
      return;
    }
    const myBlocked = Array.isArray(viewer.blocked) ? viewer.blocked : [];
    const theirBlocked = Array.isArray(target.blocked) ? target.blocked : [];
    if(myBlocked.includes(target.uid) || theirBlocked.includes(viewer.uid)){
      counts.blocked++;
      pushGroup('blocked', target, myBlocked.includes(target.uid) ? '你封鎖了對方' : '對方封鎖了你');
      return;
    }
    const gender = isGenderCompatible(viewer, target);
    if(!gender.ok){
      counts.gender++;
      pushGroup('gender', target, gender.label);
      return;
    }
    const match = calculateMutualMatch(viewer, target);
    if(match.scoreForA.excluded || match.scoreForB.excluded){
      counts.hardExclude++;
      const reason = match.scoreForA.excludeRule?.dimension || match.scoreForB.excludeRule?.dimension || '硬性條件';
      pushGroup('hardExclude', target, reason, match);
      if(hardExamples.length < 2){
        hardExamples.push(`${target.nickname || target.uid}：${reason}`);
      }
      return;
    }
    if(!match.recommended){
      counts.lowScore++;
      pushGroup('lowScore', target, `你看 ${Math.round(match.scoreForA.rawScore)} / 對方看 ${Math.round(match.scoreForB.rawScore)}`, match);
      if(lowExamples.length < 2){
        lowExamples.push(`${target.nickname || target.uid}：你看 ${Math.round(match.scoreForA.rawScore)} / 對方看 ${Math.round(match.scoreForB.rawScore)}`);
      }
      return;
    }
    counts.recommended++;
    pushGroup('recommended', target, `你看 ${Math.round(match.scoreForA.rawScore)} / 對方看 ${Math.round(match.scoreForB.rawScore)}`, match);
  });

  return { counts, groups, lowExamples, hardExamples };
}

async function loadData(){
  list.innerHTML = '<div class="empty">分析中...</div>';
  try{
    const [userSnap, actionSnap] = await Promise.all([
      getDocs(collection(db, 'users')),
      getDocs(collection(db, 'matchActions'))
    ]);
    users = userSnap.docs.map(d => ({ uid:d.id, ...d.data() }));
    actions = actionSnap.docs.map(d => d.data());
    reports = users.filter(baseCanAnalyze).map(user => ({ user, result:analyzeUser(user) }));
    render();
  } catch(e){
    console.error(e);
    list.innerHTML = '<div class="empty">分析失敗。請確認 Firestore Rules 允許管理員讀取 users 和 matchActions。</div>';
  }
}

function render(){
  const keyword = searchInput.value.trim().toLowerCase();
  const filtered = reports.filter(item => {
    const u = item.user;
    const text = [u.uid, u.nickname, u.email, u.city, u.gender, u.lookingFor].join(' ').toLowerCase();
    return !keyword || text.includes(keyword);
  });

  const hasReco = reports.filter(item => item.result.counts.recommended > 0).length;
  const avg = reports.length ? Math.round(reports.reduce((sum, item) => sum + item.result.counts.recommended, 0) / reports.length) : 0;
  document.getElementById('userCount').textContent = reports.length;
  document.getElementById('hasRecoCount').textContent = hasReco;
  document.getElementById('avgRecoCount').textContent = avg;

  if(!filtered.length){
    list.innerHTML = '<div class="empty">沒有符合的用戶</div>';
    return;
  }

  list.innerHTML = filtered.map(item => {
    const u = item.user;
    const c = item.result.counts;
    const badgeClass = c.recommended ? 'ok' : c.lowScore || c.hardExclude || c.gender ? 'warn' : 'bad';
    const examples = [
      ...item.result.hardExamples.map(t => `硬性排除：${t}`),
      ...item.result.lowExamples.map(t => `分數不足：${t}`)
    ];
    const drill = (key) => renderDrill(item, key);
    return `
      <article class="card" data-card-uid="${escapeHtml(u.uid)}">
        <div class="card-head">
          <div>
            <div class="name">${escapeHtml(u.nickname || '未命名')} · ${escapeHtml(u.city || '')}</div>
            <div class="uid">${escapeHtml(u.uid)}</div>
          </div>
          <div class="badge ${badgeClass}">${c.recommended} 可推薦</div>
        </div>
        <div class="funnel">
          <div class="row clickable" data-drill="total"><div class="row-k">全部用戶</div><div class="row-v">${c.total}</div></div>${drill('total')}
          <div class="row clickable" data-drill="self"><div class="row-k">自己</div><div class="row-v">-${c.self}</div></div>${drill('self')}
          <div class="row clickable" data-drill="alreadyActed"><div class="row-k">已喜歡 / 已略過</div><div class="row-v">-${c.alreadyActed}</div></div>${drill('alreadyActed')}
          <div class="row clickable" data-drill="notReady"><div class="row-k">未審核 / 未測驗 / 被封鎖</div><div class="row-v">-${c.notReady}</div></div>${drill('notReady')}
          <div class="row clickable" data-drill="blocked"><div class="row-k">互相封鎖</div><div class="row-v">-${c.blocked}</div></div>${drill('blocked')}
          <div class="row clickable" data-drill="gender"><div class="row-k">性別互選不符</div><div class="row-v">-${c.gender}</div></div>${drill('gender')}
          <div class="row clickable" data-drill="hardExclude"><div class="row-k">硬性條件排除</div><div class="row-v">-${c.hardExclude}</div></div>${drill('hardExclude')}
          <div class="row clickable" data-drill="lowScore"><div class="row-k">雙向未達 ${MATCH_SCORE_CONFIG.recommendationRule.threshold}</div><div class="row-v">-${c.lowScore}</div></div>${drill('lowScore')}
          <div class="row clickable" data-drill="recommended"><div class="row-k">最後可推薦</div><div class="row-v">${c.recommended}</div></div>${drill('recommended')}
        </div>
        <div class="reason">${examples.length ? escapeHtml(examples.join('\n')) : '目前沒有明顯排除範例。'}</div>
        <button class="quiz-toggle" type="button" data-quiz="${escapeHtml(u.uid)}">查看每題回答</button>
        ${renderQuizAnswers(u)}
      </article>
    `;
  }).join('');
}

function renderQuizAnswers(user){
  if(!user.quizAnswers || !Object.keys(user.quizAnswers).length){
    return `<div class="quiz-panel" data-quiz-box="${escapeHtml(user.uid)}"><div class="qa-empty">這個用戶目前沒有測驗答案</div></div>`;
  }
  const questions = getQuizQuestions(user.quizGenderVersion || user.gender || 'other');
  return `
    <div class="quiz-panel" data-quiz-box="${escapeHtml(user.uid)}">
      ${questions.map(question => {
        const value = user.quizAnswers[question.id] ?? user.quizAnswers[`q${String(question.order).padStart(2, '0')}`];
        const option = question.options.find(opt => opt.key === value || opt.value === value);
        const answerText = option ? `${option.key}. ${option.text}` : (value ? `${value}（找不到對應選項）` : '尚未回答');
        return `
          <div class="qa-item">
            <div class="qa-title">Q${question.order}. ${escapeHtml(question.title)}</div>
            <div class="qa-answer">${escapeHtml(answerText)}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderDrill(item, key){
  const rows = item.result.groups?.[key] || [];
  const viewerName = item.user.nickname || item.user.uid;
  if(!rows.length){
    return `<div class="drill" data-drill-box="${key}"><div class="drill-item"><div class="drill-photo empty">無圖</div><div class="drill-reason">沒有名單</div></div></div>`;
  }
  return `
    <div class="drill" data-drill-box="${key}">
      ${rows.slice(0, 80).map(row => `
        <div class="drill-item">
          ${row.photoURL ? `<img class="drill-photo" src="${escapeHtml(row.photoURL)}" alt="${escapeHtml(row.nickname)}">` : '<div class="drill-photo empty">無圖</div>'}
          <div>
            <div class="drill-name">${escapeHtml(row.nickname)} · ${escapeHtml(row.city || '')}</div>
            <div class="drill-meta">${escapeHtml(row.uid)} · ${escapeHtml(row.gender || '?')} / 找 ${escapeHtml(row.lookingFor || '?')}</div>
            <div class="drill-reason">${escapeHtml(row.reason || '')}${row.scoreA !== null ? ` · ${escapeHtml(viewerName)}看${row.scoreA} / 對方看${row.scoreB}` : ''}</div>
          </div>
        </div>
      `).join('')}
      ${rows.length > 80 ? `<div class="drill-item"><div class="drill-photo empty">...</div><div class="drill-reason">還有 ${rows.length - 80} 人未顯示</div></div>` : ''}
    </div>
  `;
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  try{
    await signInWithPopup(auth, provider);
  } catch(e){
    console.error(e);
    showToast('登入失敗');
  }
});
document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
document.getElementById('reloadBtn').addEventListener('click', loadData);
searchInput.addEventListener('input', render);
list.addEventListener('click', event => {
  const row = event.target.closest('[data-drill]');
  if(row){
    const card = row.closest('.card');
    const box = card?.querySelector(`[data-drill-box="${row.dataset.drill}"]`);
    if(box) box.classList.toggle('show');
    return;
  }
  const quizBtn = event.target.closest('[data-quiz]');
  if(quizBtn){
    const card = quizBtn.closest('.card');
    const box = card?.querySelector(`[data-quiz-box="${quizBtn.dataset.quiz}"]`);
    if(box) box.classList.toggle('show');
  }
});

onAuthStateChanged(auth, async user => {
  if(!user){
    loginBox.style.display = 'block';
    panel.classList.remove('show');
    return;
  }
  const ok = await isAdmin(user);
  if(!ok){
    showToast('這個帳號不是管理員');
    await signOut(auth);
    return;
  }
  loginBox.style.display = 'none';
  panel.classList.add('show');
  loadData();
});
</script>
